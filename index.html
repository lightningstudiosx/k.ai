<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>This Cat Does Not Exist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🐱</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<style>
  :root{ box-sizing:border-box }
  *{ box-sizing:inherit; margin:0; padding:0 }
  html,body{ height:100%; background:#000; overflow:hidden }
  body{
    display:flex; align-items:center; justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    cursor:pointer; user-select:none;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  /* the cat fills the screen, exactly like thispersondoesnotexist */
  canvas{
    height:100%; width:100%; object-fit:contain;
    opacity:0; transition:opacity .35s ease;
    image-rendering:auto;            /* smooth upscale = dreamy, not blocky */
  }
  canvas.on{ opacity:1 }
  #msg{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#6d6d75; font-size:15px; letter-spacing:.3px; text-align:center;
    padding:24px; pointer-events:none;
  }
  #hint{
    position:fixed; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    text-align:center; color:#ffffff; font-size:12px; letter-spacing:.6px;
    text-shadow:0 1px 6px #000; opacity:.55; transition:opacity 1.2s ease;
    pointer-events:none;
  }
  #hint.fade{ opacity:0 }
</style>
</head>
<body>
  <canvas id="out" width="64" height="64"></canvas>
  <div id="msg">waking up the cat machine…</div>
  <div id="hint">click, tap or press space for another cat &nbsp;·&nbsp; S to save</div>

<script type="module">
  const GENERATOR_URL = 'generator.onnx';   // must sit next to this file
  const LATENT_DIM = 100;

  const canvas = document.getElementById('out');
  const ctx = canvas.getContext('2d');
  const msg = document.getElementById('msg');
  const hint = document.getElementById('hint');

  let session = null, busy = false;

  function randn(n){
    const out = new Float32Array(n);
    for (let i = 0; i < n; i += 2){
      const u = Math.random() || 1e-9, v = Math.random();
      const r = Math.sqrt(-2 * Math.log(u));
      out[i] = r * Math.cos(2 * Math.PI * v);
      if (i + 1 < n) out[i + 1] = r * Math.sin(2 * Math.PI * v);
    }
    return out;
  }

  function draw(data){
    const px = 64 * 64;
    const im = ctx.createImageData(64, 64);
    for (let p = 0; p < px; p++){
      for (let c = 0; c < 3; c++){
        im.data[p * 4 + c] = Math.max(0, Math.min(255,
          (data[c * px + p] * 0.5 + 0.5) * 255));
      }
      im.data[p * 4 + 3] = 255;
    }
    ctx.putImageData(im, 0, 0);
  }

  async function newCat(){
    if (!session || busy) return;
    busy = true;
    canvas.classList.remove('on');
    try{
      const noise = new ort.Tensor('float32', randn(LATENT_DIM), [1, LATENT_DIM, 1, 1]);
      const out = await session.run({ noise });
      draw(out.image.data);
      msg.textContent = '';
      canvas.classList.add('on');
    }catch(e){
      msg.textContent = 'generation failed: ' + e.message;
    }
    busy = false;
  }

  // one cat appears the moment the page opens; reloading gives you another
  try{
    session = await ort.InferenceSession.create(GENERATOR_URL);
    await newCat();
  }catch(e){
    msg.textContent = 'could not load generator.onnx — is it uploaded next to this page?';
  }

  // extras that stay invisible until you want them
  document.body.addEventListener('click', newCat);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.key === 'Enter'){ e.preventDefault(); newCat(); }
    if (e.key === 's' || e.key === 'S'){
      const big = document.createElement('canvas');
      big.width = big.height = 1024;
      const b = big.getContext('2d');
      b.imageSmoothingEnabled = true;
      b.drawImage(canvas, 0, 0, 1024, 1024);
      const a = document.createElement('a');
      a.download = 'cat_' + Date.now() + '.png';
      a.href = big.toDataURL('image/png');
      a.click();
    }
  });

  setTimeout(() => hint.classList.add('fade'), 4000);
</script>
</body>
</html>
