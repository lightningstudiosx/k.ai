<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>This Cat Does Not Exist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🐱</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<style>
  :root{ box-sizing:border-box }
  *{ box-sizing:inherit; margin:0; padding:0 }
  html,body{ height:100%; background:#000; overflow:hidden }
  body{
    display:flex; align-items:center; justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    cursor:pointer; user-select:none;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  canvas{
    height:100%; width:100%; object-fit:contain;
    opacity:0; transition:opacity .4s ease;
    image-rendering:auto;
    filter:saturate(1.12) contrast(1.06);   /* small lift, not a cartoon */
  }
  canvas.on{ opacity:1 }
  #msg{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#6d6d75; font-size:15px; text-align:center; padding:24px; pointer-events:none;
  }
  /* thin progress line across the very top — feedback while it searches */
  #bar{
    position:fixed; top:0; left:0; height:2px; width:0;
    background:linear-gradient(90deg,#ff9f45,#ffd166);
    transition:width .25s ease, opacity .8s ease; z-index:5;
  }
  #bar.done{ opacity:0 }
  #note{
    position:fixed; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    text-align:center; color:#fff; font-size:12px; letter-spacing:.5px;
    text-shadow:0 1px 6px #000; opacity:.5; transition:opacity 1s ease;
    pointer-events:none;
  }
  #note.fade{ opacity:0 }
</style>
</head>
<body>
  <div id="bar"></div>
  <canvas id="out" width="1024" height="1024"></canvas>
  <div id="msg">waking up the cat machine…</div>
  <div id="note"></div>

<script type="module">
  // ---------------------------------------------------------------------
  //  Each cat shown here is the BEST of TRIES candidates, judged by CLIP.
  //  Change the count with ?tries=500 in the URL.
  // ---------------------------------------------------------------------
  const GENERATOR_URL = 'generator.onnx';
  const CLIP_MODEL = 'Xenova/clip-vit-base-patch32';
  const LATENT_DIM = 100;
  const RANK_PROMPT = 'a sharp clear photo of a cat face, detailed fur and eyes';
  const TRIES = Math.min(2000, Math.max(1,
      parseInt(new URLSearchParams(location.search).get('tries'), 10) || 3));
  const CHUNK = 3;              // cats generated per batch

  const canvas = document.getElementById('out');
  const ctx = canvas.getContext('2d');
  const msg = document.getElementById('msg');
  const note = document.getElementById('note');
  const bar = document.getElementById('bar');

  let session = null, clip = null, running = false;

  const setNote = t => { note.textContent = t; note.classList.remove('fade'); };
  const fadeNote = () => note.classList.add('fade');

  function randn(n){
    const out = new Float32Array(n);
    for (let i = 0; i < n; i += 2){
      const u = Math.random() || 1e-9, v = Math.random();
      const r = Math.sqrt(-2 * Math.log(u));
      out[i] = r * Math.cos(2 * Math.PI * v);
      if (i + 1 < n) out[i + 1] = r * Math.sin(2 * Math.PI * v);
    }
    return out;
  }
  async function generateBatch(b){
    const noise = new ort.Tensor('float32', randn(b * LATENT_DIM), [b, LATENT_DIM, 1, 1]);
    return (await session.run({ noise })).image;
  }
  function toRGB(data, idx){
    const px = 64 * 64, rgb = new Uint8ClampedArray(px * 3), base = idx * 3 * px;
    for (let p = 0; p < px; p++)
      for (let c = 0; c < 3; c++)
        rgb[p*3+c] = Math.max(0, Math.min(255, (data[base + c*px + p] * 0.5 + 0.5) * 255));
    return rgb;
  }
  // --- upscaling ---------------------------------------------------------
  // The model emits 64x64. Stretching that straight to a 4K screen in one
  // step is the blurriest option there is. Doubling repeatedly with
  // smoothing on (64 -> 128 -> 256 -> 512 -> 1024) keeps far more edge
  // detail, then one light sharpen pass brings back the fur.
  const src64 = document.createElement('canvas');
  src64.width = src64.height = 64;
  const sctx = src64.getContext('2d');

  function sharpen(c, amount){
    const w = c.width, h = c.height, k = c.getContext('2d');
    const src = k.getImageData(0, 0, w, h), out = k.createImageData(w, h);
    const S = src.data, O = out.data;
    for (let y = 1; y < h - 1; y++){
      for (let x = 1; x < w - 1; x++){
        for (let c2 = 0; c2 < 3; c2++){
          const i = (y * w + x) * 4 + c2;
          const blur = (S[i - 4] + S[i + 4] + S[i - w * 4] + S[i + w * 4]) / 4;
          O[i] = Math.max(0, Math.min(255, S[i] + (S[i] - blur) * amount));
        }
        O[(y * w + x) * 4 + 3] = 255;
      }
    }
    // copy the untouched 1px border
    for (let x = 0; x < w; x++)
      for (const y of [0, h - 1])
        for (let c2 = 0; c2 < 4; c2++) O[(y*w+x)*4+c2] = S[(y*w+x)*4+c2];
    for (let y = 0; y < h; y++)
      for (const x of [0, w - 1])
        for (let c2 = 0; c2 < 4; c2++) O[(y*w+x)*4+c2] = S[(y*w+x)*4+c2];
    k.putImageData(out, 0, 0);
  }

  function draw(rgb){
    const im = sctx.createImageData(64, 64);
    for (let p = 0; p < 64*64; p++){
      im.data[p*4] = rgb[p*3]; im.data[p*4+1] = rgb[p*3+1];
      im.data[p*4+2] = rgb[p*3+2]; im.data[p*4+3] = 255;
    }
    sctx.putImageData(im, 0, 0);

    // progressive 2x upscale chain
    let cur = src64, size = 64;
    while (size < 1024){
      size *= 2;
      const next = document.createElement('canvas');
      next.width = next.height = size;
      const nx = next.getContext('2d');
      nx.imageSmoothingEnabled = true;
      nx.imageSmoothingQuality = 'high';
      nx.drawImage(cur, 0, 0, size, size);
      if (size >= 256) sharpen(next, 0.35);   // light, only at larger sizes
      cur = next;
    }
    ctx.clearRect(0, 0, 1024, 1024);
    ctx.drawImage(cur, 0, 0);
    canvas.classList.add('on');
    msg.textContent = '';
  }
  function cosine(a, b){
    let d = 0, na = 0, nb = 0;
    for (let i = 0; i < a.length; i++){ d += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
    return d / (Math.sqrt(na) * Math.sqrt(nb) + 1e-9);
  }

  async function loadClip(){
    if (clip) return clip;
    setNote('loading the cat judge (one time, ~60 MB)…');
    const T = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
    const prog = d => {
      if (d.status === 'progress' && d.total)
        bar.style.width = (30 * d.loaded / d.total).toFixed(1) + '%';
    };
    const [tokenizer, textModel, processor, visionModel] = await Promise.all([
      T.AutoTokenizer.from_pretrained(CLIP_MODEL),
      T.CLIPTextModelWithProjection.from_pretrained(CLIP_MODEL, { progress_callback: prog }),
      T.AutoProcessor.from_pretrained(CLIP_MODEL),
      T.CLIPVisionModelWithProjection.from_pretrained(CLIP_MODEL, { progress_callback: prog }),
    ]);
    clip = { tokenizer, textModel, processor, visionModel, RawImage: T.RawImage };
    return clip;
  }

  async function bestCat(){
    if (!session || running) return;
    running = true;
    bar.classList.remove('done');
    bar.style.width = '2%';
    canvas.classList.remove('on');            // stay hidden until the winner is ready
    msg.textContent = 'finding a cat…';
    setNote('');

    try{
      await loadClip();
      const tok = clip.tokenizer([RANK_PROMPT], { padding: true, truncation: true });
      const textEmb = (await clip.textModel(tok)).text_embeds.data;

      let bestScore = -2, bestRGB = null, done = 0;
      const t0 = performance.now();
      while (done < TRIES){
        const b = Math.min(CHUNK, TRIES - done);
        const batch = await generateBatch(b);
        for (let i = 0; i < b; i++){
          const rgb = toRGB(batch.data, i);
          const inputs = await clip.processor(new clip.RawImage(rgb, 64, 64, 3));
          const score = cosine(textEmb, (await clip.visionModel(inputs)).image_embeds.data);
          if (score > bestScore){ bestScore = score; bestRGB = rgb; }
        }
        done += b;
        bar.style.width = (30 + 70 * done / TRIES).toFixed(1) + '%';
        msg.textContent = `finding a cat… ${done}/${TRIES}`;
        await new Promise(r => setTimeout(r, 0));   // let the screen repaint
      }
      bar.style.width = '100%';
      bar.classList.add('done');
      if (bestRGB) draw(bestRGB);             // <- the one and only reveal
      setNote(`best of ${TRIES} cats  ·  click for another`);
      setTimeout(fadeNote, 3000);
    }catch(e){
      // judge unavailable: fall back to a plain random cat so the page still works
      bar.classList.add('done');
      const solo = await generateBatch(1);
      draw(toRGB(solo.data, 0));
      setNote('random cat (matcher unavailable)');
      setTimeout(fadeNote, 3000);
    }
    running = false;
  }

  try{
    session = await ort.InferenceSession.create(GENERATOR_URL);
    await bestCat();
  }catch(e){
    msg.textContent = 'could not load generator.onnx — is it uploaded next to this page?';
  }

  document.body.addEventListener('click', () => { if (!running) bestCat(); });
  document.addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.key === 'Enter') && !running){ e.preventDefault(); bestCat(); }
    if (e.key === 's' || e.key === 'S'){
      const a = document.createElement('a');
      a.download = 'cat_' + Date.now() + '.png';
      a.href = canvas.toDataURL('image/png');   // already 1024x1024
      a.click();
    }
  });
</script>
</body>
</html>
