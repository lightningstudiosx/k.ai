<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K.AI · Kai.fun</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#141414;color:#f7f3ea;font-family:"Trebuchet MS",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;}
  header{padding:12px 16px;border-bottom:4px solid #7a4fd0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  header h1{font-size:26px;font-weight:900;} header h1 span{color:#ffd84d;}
  header .sub{color:#b9ad90;font-size:12px;flex:1;min-width:200px;}
  #log{flex:1;overflow:auto;padding:16px;max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;}
  .msg{padding:10px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap;line-height:1.5;font-size:15px;border:3px solid #141414;}
  .me{background:#7a4fd0;color:#fff;align-self:flex-end;box-shadow:3px 3px 0 #3a2a5e;}
  .bot{background:#f7f3ea;color:#141414;align-self:flex-start;box-shadow:3px 3px 0 #7a4fd0;font-weight:700;}
  .bot.thinking{opacity:.6;}
  form{display:flex;gap:8px;padding:12px 16px;border-top:4px solid #7a4fd0;max-width:760px;width:100%;margin:0 auto;}
  input{flex:1;background:#f7f3ea;color:#141414;border:3px solid #141414;border-radius:12px;padding:12px;font-family:inherit;font-size:16px;font-weight:700;}
  button{background:#ffd84d;color:#141414;border:3px solid #141414;border-radius:12px;font-family:inherit;font-weight:900;font-size:15px;padding:0 18px;cursor:pointer;box-shadow:3px 3px 0 #7a4fd0;}
  button.ghost{background:#f7f3ea;}
  #status{font-size:12px;color:#b9ad90;padding:4px 16px;text-align:center;}
  a.back{color:#b9ad90;font-size:12px;text-decoration:none;}
</style>
</head>
<body>
<header><h1>K<span>.</span>AI</h1><span class="sub">Kaimind — a language model Kai trained from scratch. it runs entirely in your browser: no server, no borrowed brains, 3.7 million neurons of pure Kai.</span><a class="back" href="index.html">← kai.fun</a></header>
<div id="log"></div>
<div id="status">loading the brain…</div>
<form id="f"><input id="in" placeholder="say something to Kaimind…" autocomplete="off" disabled><button id="send" disabled>send</button><button type="button" class="ghost" id="reset">reset</button></form>
<script src="kaimind_model.js"></script>
<script src="kaimind_web.js"></script>
<script>
"use strict";
const log=document.getElementById("log"), inp=document.getElementById("in"), st=document.getElementById("status");
function add(cls,text){ const d=document.createElement("div"); d.className="msg "+cls; d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }
let K=null, history=[];
if(!window.KAIMIND){ st.textContent="kaimind_model.js is missing — run export_web.py and put it next to this page."; }
else { setTimeout(()=>{ K=window.Kaimind.load(); st.textContent="Kaimind online · "+K.step.toLocaleString()+" training steps · val loss "+K.valLoss.toFixed(2)+" · running on your CPU"; inp.disabled=false; document.getElementById("send").disabled=false; inp.focus(); add("bot","hi. I'm Kaimind. I was trained from nothing on Kai's computer. I may say strange things. that's the charm."); },50); }
async function send(){ const text=inp.value.trim(); if(!text||!K) return; inp.value=""; add("me",text); history.push(["User",text]); if(history.length>6) history=history.slice(-6);
  const prompt=history.map(([r,t])=>r+": "+t+"\n").join("")+"Kaimind:"; const bot=add("bot thinking","…"); inp.disabled=true;
  const reply=await K.generate(K.tok.encode(prompt),{maxNew:60,temperature:0.8,topK:40,onToken:t=>{ bot.textContent=t.split("\nUser:")[0].split("\n\n")[0]; log.scrollTop=log.scrollHeight; }});
  bot.textContent=reply||"…"; bot.classList.remove("thinking"); history.push(["Kaimind",reply||"…"]); inp.disabled=false; inp.focus(); }
document.getElementById("f").onsubmit=e=>{ e.preventDefault(); send(); };
document.getElementById("reset").onclick=()=>{ history=[]; log.innerHTML=""; add("bot","memory wiped. who are you again?"); };
</script>
</body>
</html>
